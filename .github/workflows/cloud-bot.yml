# Momentum bot running on GitHub itself (no VPS): once an hour a Windows machine installs MT5, logs in, runs
# cloud_runner.py (crypto breakouts + gold 1H breakouts both ways: manage trades, new entries, Telegram), shuts down.
#
# Telegram control: telegram-control.yml answers your commands, starts this workflow on demand and, because
# GitHub's cron is unreliable, also starts the hourly check itself (hourly=true). The cron below is a backup.
# MT5 login: send it to the Telegram bot as  /login <account> <password> [server]  (stored encrypted),
# or set secrets (Settings -> Secrets and variables -> Actions):
#   MT5_LOGIN, MT5_PASSWORD             optional when /login is used
#   MT5_SERVER                          optional, default Exness-MT5Trial9
#   MOMENTUM_TELEGRAM_TOKEN             Telegram bot that reports and answers /status /trades /filter
#   MOMENTUM_TELEGRAM_CHAT_ID           optional (otherwise the first /start claims the bot)
# Variable (optional): MOMENTUM_RISK_PCT (default 5)
#
# The schedule only runs from the default branch (main). Pushes run a "dry" check: log in, read data, no orders.
# Logs are public (public repo): cloud_runner.py prints no account data; details go to Telegram.
name: Momentum bot (GitHub cloud)

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "live = trade, dry = check only"
        type: choice
        options: [live, dry]
        default: live
      hourly:
        description: "the regular hourly check (started by the Telegram listener)"
        type: boolean
        default: false
  push:
    branches: [main, ccr-40ef48ac-4webyc]
    paths: ["cloud_runner.py", "cloud_common.py", "momentum_strategy.py", "metals_strategy.py", "config.py", ".github/workflows/cloud-bot.yml"]

permissions:
  contents: read
  actions: write      # only for the monthly keep-alive below

concurrency:
  group: momentum-cloud-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MODE: ${{ github.event_name == 'push' && 'dry' || inputs.mode || 'live' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python packages
        run: pip install --quiet --disable-pip-version-check MetaTrader5 pandas numpy requests cryptography

      - name: Restore trading state
        uses: actions/cache/restore@v4
        with:
          path: cloud_state
          key: cloud-runner-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cloud-runner-
          enableCrossOsArchive: true

      - name: Restore Telegram settings (written by telegram-control.yml)
        uses: actions/cache/restore@v4
        with:
          path: cloud_ctl
          key: cloud-ctl-none
          restore-keys: cloud-ctl-
          enableCrossOsArchive: true

      - name: Install MetaTrader 5 (Exness)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $urls = @("https://download.mql5.com/cdn/web/exness.technologies.ltd/mt5/exness5setup.exe",
                    "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe")
          foreach ($u in $urls) {
            try { Invoke-WebRequest -Uri $u -OutFile "$env:RUNNER_TEMP\mt5setup.exe" -UseBasicParsing; break }
            catch { Write-Host "Download failed: $u" }
          }
          $p = Start-Process "$env:RUNNER_TEMP\mt5setup.exe" -ArgumentList "/auto" -PassThru
          $deadline = (Get-Date).AddMinutes(10)
          do {
            Start-Sleep 10
            $t = Get-ChildItem "C:\Program Files\*\terminal64.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          } while ((-not $t -or -not $p.HasExited) -and (Get-Date) -lt $deadline)
          if (-not $t) { throw "MT5 did not install" }
          Get-Process | Where-Object { $_.Name -like "terminal*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          "MT5_PATH=$($t.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "MT5 installed."

      - name: Allow Algo Trading in the terminal
        shell: python
        run: |
          import os
          cfg = os.path.join(os.path.dirname(os.environ["MT5_PATH"]), "Config")
          os.makedirs(cfg, exist_ok=True)
          body = "[Experts]\r\nAllowLiveTrading=1\r\nAllowDllImport=0\r\nEnabled=1\r\nAccount=0\r\nProfile=0\r\n"
          with open(os.path.join(cfg, "common.ini"), "wb") as f:
              f.write(b"\xff\xfe" + body.encode("utf-16-le"))

      - name: Run the momentum bot (${{ env.MODE }})
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER || 'Exness-MT5Trial9' }}
          MOMENTUM_TELEGRAM_TOKEN: ${{ secrets.MOMENTUM_TELEGRAM_TOKEN }}
          MOMENTUM_TELEGRAM_CHAT_ID: ${{ secrets.MOMENTUM_TELEGRAM_CHAT_ID }}
          MOMENTUM_RISK_PCT: ${{ vars.MOMENTUM_RISK_PCT || '5' }}
          MT5_PORTABLE: "1"
          HOURLY_CHECK: ${{ inputs.hourly && 'true' || 'false' }}
          TELEGRAM_TOKEN: ""
          PYTHONIOENCODING: utf-8
        run: python cloud_runner.py

      - name: Save trading state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cloud_state
          key: cloud-runner-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true

      - name: Remove old state copies (keep the newest 3)
        if: always() && env.MODE == 'live'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list -R "${{ github.repository }}" --key cloud-runner- --sort created_at --order desc --limit 100 \
            --json id --jq '.[3:][].id' | xargs -r -n1 gh cache delete -R "${{ github.repository }}" >/dev/null 2>&1 || true

      - name: Keep the schedule alive (GitHub pauses schedules after 60 quiet days)
        if: github.event_name == 'schedule' && always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%d%H)" = "0100" ]; then
            curl -s -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/cloud-bot.yml/enable" -o /dev/null -w "keep-alive %{http_code}\n"
          fi
