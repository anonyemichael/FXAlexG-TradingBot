# Runs deploy/setup_server.sh on fresh Ubuntu machines (same OS as a new Google Cloud server) and checks that
# Wine, MetaTrader 5, Windows Python + MetaTrader5 package, the services and the bridge start-up all work.
# Uses a fake MT5 account, so the bridge is expected to stop at "can't log in".
name: Test server setup script

on:
  push:
    branches: [main, ccr-40ef48ac-4webyc]
    paths: ["deploy/**", ".github/workflows/test-server-setup.yml", "mt5_bridge.py"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-server-setup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Run the setup script (non-interactive, fake account)
        env:
          NONINTERACTIVE: "1"
          MT5_LOGIN: "12345678"
          MT5_PASSWORD: "not-a-real-password"
          MT5_SERVER: "Exness-MT5Trial9"
          TELEGRAM_TOKEN: "000000:not-a-real-token"
          START_SERVICES: "0"
          BRANCH: ${{ github.ref_name }}
        run: bash deploy/setup_server.sh

      - name: Services and files are in place
        run: |
          set -euo pipefail
          systemctl is-active xvfb
          systemctl cat mt5-bridge fxalexg-bot >/dev/null
          systemctl is-enabled mt5-bridge fxalexg-bot
          test -f "$HOME/fxalexg_bot/.env"
          [ "$(stat -c %a "$HOME/fxalexg_bot/.env")" = 600 ]
          test -x "$HOME/fxalexg_bot/.venv/bin/python"
          ls -l "$HOME/.wine_exness/drive_c/Program Files/"

      - name: Windows Python can start MetaTrader 5
        run: |
          set -uo pipefail
          export WINEPREFIX=$HOME/.wine_exness WINEDEBUG=-all DISPLAY=:99
          PY="$WINEPREFIX/drive_c/Program Files/Python39/python.exe"
          cat > /tmp/check.py <<'PY'
          import os, time, MetaTrader5 as mt5
          cands = [r"C:\Program Files\MetaTrader 5 EXNESS\terminal64.exe", r"C:\Program Files\MetaTrader 5\terminal64.exe"]
          path = next(p for p in cands if os.path.exists(p))   # same order mt5_bridge.py uses
          print("terminal path:", path)
          t0 = time.time()
          ok = mt5.initialize(path=path, timeout=180000)
          print("initialize:", ok, "after", round(time.time() - t0), "s", mt5.last_error())
          if ok:
              ti = mt5.terminal_info()
              print("terminal:", ti.name, "build", mt5.version(), "connected:", ti.connected, "trade_allowed:", ti.trade_allowed)
              mt5.shutdown()
          raise SystemExit(0 if ok else 1)
          PY
          timeout 300 wine "$PY" 'Z:/tmp/check.py' | tr -d '\r'

      - name: Bridge starts and reaches the broker login (fake account -> login refused)
        run: |
          set -uo pipefail
          export WINEPREFIX=$HOME/.wine_exness WINEDEBUG=-all DISPLAY=:99
          wineserver -k || true
          PY="$WINEPREFIX/drive_c/Program Files/Python39/python.exe"
          cd "$HOME/fxalexg_bot"
          timeout 300 wine "$PY" "Z:$HOME/fxalexg_bot/mt5_bridge.py" 2>&1 | tr -d '\r' | tee /tmp/bridge.log || true
          grep -Eq "Attempting initial broker login|Cannot read account|MT5 Bridge Online" /tmp/bridge.log

      - name: Bot unit tests in the server's Python environment
        run: |
          cd "$HOME/fxalexg_bot"
          .venv/bin/python test_momentum.py
          .venv/bin/python test_monitor.py

  gcp-startup:
    # The Google Cloud "server sets itself up" mode: startup script run as root with metadata values.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Run deploy/gcp_startup.sh as root (fake account in place of VM metadata)
        run: |
          sudo env META_MT5_LOGIN=12345678 META_MT5_PASSWORD='p@ss word$1' META_MT5_SERVER=Exness-MT5Trial9 \
            META_TELEGRAM_TOKEN=000000:not-a-real-token META_MOMENTUM_TELEGRAM_TOKEN=111111:not-real \
            META_BRANCH="${{ github.ref_name }}" SETUP_SCRIPT_PATH="$PWD/deploy/setup_server.sh" \
            bash deploy/gcp_startup.sh

      - name: Bot runs as user "trader", secrets stored privately, auto-update timer on
        run: |
          set -euo pipefail
          id trader
          sudo test -f /home/trader/fxalexg_bot/.env
          [ "$(sudo stat -c '%a %U' /home/trader/fxalexg_bot/.env)" = "600 trader" ]
          sudo grep -q "^MT5_DEMO_PASSWORD=p@ss word\$1$" /home/trader/fxalexg_bot/.env
          sudo grep -q "^MOMENTUM_TELEGRAM_TOKEN=111111:not-real$" /home/trader/fxalexg_bot/.env.monitor
          ! sudo ls /home/trader/.ssh/github_deploy 2>/dev/null
          systemctl is-active xvfb
          systemctl is-enabled mt5-bridge fxalexg-bot fxalexg-update.timer
          systemctl is-active fxalexg-update.timer
          sudo -u trader -H /usr/local/bin/fxalexg-update; echo "updater exit: $?"

      - name: Second boot is quick and keeps working
        run: |
          start=$(date +%s)
          sudo env META_MT5_LOGIN=12345678 META_MT5_PASSWORD='p@ss word$1' META_MT5_SERVER=Exness-MT5Trial9 \
            META_TELEGRAM_TOKEN=000000:not-a-real-token META_BRANCH="${{ github.ref_name }}" \
            SETUP_SCRIPT_PATH="$PWD/deploy/setup_server.sh" bash deploy/gcp_startup.sh
          echo "second run took $(( $(date +%s) - start )) s"
